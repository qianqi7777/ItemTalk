name: CI
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Lint
      working-directory: frontend
      run: npm run lint
    - name: Type check
      working-directory: frontend
      run: npm run typecheck
    - name: Test
      working-directory: frontend
      run: npm test
    - name: Build
      working-directory: frontend
      run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: itemtalk_test
          POSTGRES_USER: itemtalk
          POSTGRES_PASSWORD: test
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      working-directory: backend
      run: uv sync --locked
    - name: Lint
      working-directory: backend
      run: uv run ruff check .
    - name: Format check
      working-directory: backend
      run: uv run ruff format --check .
    - name: Create extensions
      run: |
        PGPASSWORD=test psql -h localhost -U itemtalk -d itemtalk_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
        PGPASSWORD=test psql -h localhost -U itemtalk -d itemtalk_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        PGPASSWORD=test psql -h localhost -U itemtalk -d itemtalk_test -v ON_ERROR_STOP=1 -f infra/runtime-roles.sql
        PGPASSWORD=test psql -h localhost -U itemtalk -d itemtalk_test -c "ALTER ROLE itemtalk_migrator LOGIN PASSWORD 'test'; ALTER ROLE itemtalk_app LOGIN PASSWORD 'test'; ALTER ROLE itemtalk_worker LOGIN PASSWORD 'test';"
    - name: Run migrations
      working-directory: backend
      env:
        DATABASE_URL: postgresql+psycopg://itemtalk_migrator:test@localhost:5432/itemtalk_test
        DB_HOST: localhost
        DB_NAME: itemtalk_test
        DB_USER: itemtalk
        DB_PASSWORD: test
      run: uv run alembic upgrade head
    - name: Test
      working-directory: backend
      env:
        DATABASE_URL: postgresql+psycopg://itemtalk:test@localhost:5432/itemtalk_test
        JWT_SECRET: test-secret
        TEST_DATABASE_URL: postgresql+psycopg://itemtalk:test@localhost:5432/itemtalk_test
        DB_HOST: localhost
        DB_NAME: itemtalk_test
        DB_USER: itemtalk
        DB_PASSWORD: test
      run: uv run pytest -v
  containers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Validate deployment scripts
      run: bash -n infra/*.sh
    - name: Validate development Compose
      run: docker compose -f docker-compose.dev.yml --env-file .env.example config --quiet
    - name: Build API image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: itemtalk-api:ci
        cache-from: type=gha,scope=api
        cache-to: type=gha,mode=max,scope=api
    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: itemtalk-frontend:ci
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: itemtalk_e2e
          POSTGRES_USER: itemtalk
          POSTGRES_PASSWORD: test
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://itemtalk:test@localhost:5432/itemtalk_e2e
      MODEL_PROVIDER: mock
      STORAGE_BACKEND: local
      AUTH_COOKIE_SECURE: 'false'
      AUTH_COOKIE_PATH: /
      APP_PUBLIC_URL: http://localhost:5173/
      RATE_LIMIT_PER_MINUTE: '10000'
      DAILY_MODEL_CALL_LIMIT: '10000'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - name: Install and migrate
      working-directory: backend
      run: |
        uv sync --locked
        PGPASSWORD=test psql -h localhost -U itemtalk -d itemtalk_e2e -v ON_ERROR_STOP=1 -f ../infra/runtime-roles.sql
        PGPASSWORD=test psql -h localhost -U itemtalk -d itemtalk_e2e -c "ALTER ROLE itemtalk_migrator LOGIN PASSWORD 'test'; ALTER ROLE itemtalk_app LOGIN PASSWORD 'test'; ALTER ROLE itemtalk_worker LOGIN PASSWORD 'test'; CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        DATABASE_URL=postgresql+psycopg://itemtalk_migrator:test@localhost:5432/itemtalk_e2e uv run alembic upgrade head
    - name: Start API and worker
      working-directory: backend
      run: |
        DATABASE_URL=postgresql+psycopg://itemtalk_app:test@localhost:5432/itemtalk_e2e setsid uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/itemtalk-api.log 2>&1 &
        echo "$!" > /tmp/itemtalk-api.pid
        DATABASE_URL=postgresql+psycopg://itemtalk_worker:test@localhost:5432/itemtalk_e2e setsid uv run python -m app.worker > /tmp/itemtalk-worker.log 2>&1 &
        echo "$!" > /tmp/itemtalk-worker.pid
        for attempt in {1..30}; do
          if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then exit 0; fi
          sleep 1
        done
        exit 1
    - name: Browser E2E
      working-directory: frontend
      run: |
        npm ci
        npx playwright install --with-deps chromium
        npm run test:e2e
    - name: Stop test services before dependency cache cleanup
      if: always()
      run: |
        for pid_file in /tmp/itemtalk-api.pid /tmp/itemtalk-worker.pid; do
          if [[ -f "$pid_file" ]]; then
            kill -- "-$(cat "$pid_file")" 2>/dev/null || true
          fi
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mvp-browser-results
        path: frontend/test-results/
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
    - dev
