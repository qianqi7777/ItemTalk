services:
  db:
    image: ${DB_IMAGE:-ghcr.io/qianqi7777/itemtalk-db:${IMAGE_TAG:?Set fixed release tag}}
    environment:
      POSTGRES_DB: itemtalk
      POSTGRES_USER: itemtalk_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set bootstrap password}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set application password}
      MIGRATION_DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set migration password}
      WORKER_DB_PASSWORD: ${DB_WORKER_PASSWORD:?Set Worker password}
    volumes:
    - /opt/itemtalk/data/postgres:/var/lib/postgresql/data
    - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    - ./infra/init-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    - ./infra/runtime-roles.sql:/docker-entrypoint-initdb.d/runtime-roles.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U itemtalk_admin -d itemtalk
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - itemtalk
  api:
    image: ${API_IMAGE:-ghcr.io/qianqi7777/itemtalk-api:${IMAGE_TAG:?Set fixed release tag}}
    environment:
      V2_ENABLED: ${V2_ENABLED:-false}
      MODEL_PROFILES: ${MODEL_PROFILES:-}
      MODEL_PRICES: ${MODEL_PRICES:-}
      RUNTIME_GLOBAL_HARD_LIMIT: ${RUNTIME_GLOBAL_HARD_LIMIT:-1000}
      RUNTIME_SUBJECT_HARD_LIMIT: ${RUNTIME_SUBJECT_HARD_LIMIT:-100}
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-86400}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-dashscope}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.7-flash}
      VISION_PROVIDER: ${VISION_PROVIDER:-dashscope}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-qwen3.7-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-initial}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:?Set SEARCH_API_KEY}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_API_KEY: ${STT_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-beijing}
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: itemtalk
      DB_USER: itemtalk_app
      DB_PASSWORD: ${DB_PASSWORD:?Set application password}
      BUILD_VERSION: ${RELEASE_SHA:?Set release SHA}
      JWT_SECRET: ${JWT_SECRET:?Set JWT secret}
      AUTH_COOKIE_SECURE: 'true'
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/itemtalk/}
      PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-/itemtalk}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://49.233.65.195/itemtalk/}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-cos}
      STORAGE_DIRECTORY: /app/.local-data/assets
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.bochaai.com/v1/web-search}
      DAILY_MODEL_CALL_LIMIT: ${DAILY_MODEL_CALL_LIMIT:-100}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      DAILY_GLOBAL_MODEL_CALL_LIMIT: ${DAILY_GLOBAL_MODEL_CALL_LIMIT:-1000}
      STT_BASE_URL: ${STT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      STT_MODEL: ${STT_MODEL:-qwen3-asr-flash}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-45}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-60}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-60}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-20}
      UPSTREAM_MAX_ATTEMPTS: ${UPSTREAM_MAX_ATTEMPTS:-2}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-10}
      FETCH_DNS_PROVIDER: ${FETCH_DNS_PROVIDER:-system}
    volumes:
    - /opt/itemtalk/data/assets:/app/.local-data/assets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - itemtalk
  worker:
    image: ${API_IMAGE:-ghcr.io/qianqi7777/itemtalk-api:${IMAGE_TAG:?Set fixed release tag}}
    environment:
      V2_ENABLED: ${V2_ENABLED:-false}
      MODEL_PROFILES: ${MODEL_PROFILES:-}
      MODEL_PRICES: ${MODEL_PRICES:-}
      RUNTIME_GLOBAL_HARD_LIMIT: ${RUNTIME_GLOBAL_HARD_LIMIT:-1000}
      RUNTIME_SUBJECT_HARD_LIMIT: ${RUNTIME_SUBJECT_HARD_LIMIT:-100}
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-86400}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-dashscope}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.7-flash}
      VISION_PROVIDER: ${VISION_PROVIDER:-dashscope}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-qwen3.7-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-initial}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:?Set SEARCH_API_KEY}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_API_KEY: ${STT_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-beijing}
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: itemtalk
      DB_USER: itemtalk_worker
      DB_PASSWORD: ${DB_WORKER_PASSWORD:?Set Worker password}
      BUILD_VERSION: ${RELEASE_SHA:?Set release SHA}
      JWT_SECRET: ${JWT_SECRET:?Set JWT secret}
      AUTH_COOKIE_SECURE: 'true'
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/itemtalk/}
      PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-/itemtalk}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://49.233.65.195/itemtalk/}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-cos}
      STORAGE_DIRECTORY: /app/.local-data/assets
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.bochaai.com/v1/web-search}
      DAILY_MODEL_CALL_LIMIT: ${DAILY_MODEL_CALL_LIMIT:-100}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      DAILY_GLOBAL_MODEL_CALL_LIMIT: ${DAILY_GLOBAL_MODEL_CALL_LIMIT:-1000}
      STT_BASE_URL: ${STT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      STT_MODEL: ${STT_MODEL:-qwen3-asr-flash}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-45}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-60}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-60}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-20}
      UPSTREAM_MAX_ATTEMPTS: ${UPSTREAM_MAX_ATTEMPTS:-2}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-10}
      FETCH_DNS_PROVIDER: ${FETCH_DNS_PROVIDER:-system}
    volumes:
    - /opt/itemtalk/data/assets:/app/.local-data/assets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: python -m app.worker
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
    - itemtalk
  caddy:
    image: ${FRONTEND_IMAGE:-ghcr.io/qianqi7777/itemtalk-frontend:${IMAGE_TAG:?Set fixed release tag}}
    ports:
    - 127.0.0.1:8400:8080
    volumes:
    - ./infra/Caddyfile.shared:/etc/caddy/Caddyfile:ro
    - /opt/itemtalk/data/caddy:/data
    - /opt/itemtalk/data/caddy_config:/config
    restart: unless-stopped
    networks:
    - itemtalk
    depends_on:
    - api
  migration:
    image: ${API_IMAGE:-ghcr.io/qianqi7777/itemtalk-api:${IMAGE_TAG:?Set fixed release tag}}
    profiles:
    - maintenance
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-dashscope}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.7-flash}
      VISION_PROVIDER: ${VISION_PROVIDER:-dashscope}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-qwen3.7-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-initial}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:?Set SEARCH_API_KEY}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_API_KEY: ${STT_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-beijing}
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: itemtalk
      DB_USER: itemtalk_migrator
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set migration password}
      BUILD_VERSION: ${RELEASE_SHA:?Set release SHA}
      JWT_SECRET: ${JWT_SECRET:?Set JWT secret}
      AUTH_COOKIE_SECURE: 'true'
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/itemtalk/}
      PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-/itemtalk}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://49.233.65.195/itemtalk/}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-cos}
      STORAGE_DIRECTORY: /app/.local-data/assets
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.bochaai.com/v1/web-search}
      DAILY_MODEL_CALL_LIMIT: ${DAILY_MODEL_CALL_LIMIT:-100}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      DAILY_GLOBAL_MODEL_CALL_LIMIT: ${DAILY_GLOBAL_MODEL_CALL_LIMIT:-1000}
      STT_BASE_URL: ${STT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      STT_MODEL: ${STT_MODEL:-qwen3-asr-flash}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-45}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-60}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-60}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-20}
      UPSTREAM_MAX_ATTEMPTS: ${UPSTREAM_MAX_ATTEMPTS:-2}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-10}
      FETCH_DNS_PROVIDER: ${FETCH_DNS_PROVIDER:-system}
    entrypoint:
    - python
    - -m
    - alembic
    command:
    - upgrade
    - head
    volumes:
    - /opt/itemtalk/data/assets:/app/.local-data/assets
    depends_on:
      db:
        condition: service_healthy
    networks:
    - itemtalk
  backup:
    image: ${BACKUP_IMAGE:-ghcr.io/qianqi7777/itemtalk-backup:${IMAGE_TAG:?Set fixed release tag}}
    profiles:
    - backup-tools
    # 仅显式运维run使用管理员；API/Worker不会继承此服务的权限和配置。
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1001}"
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    # 独立备份桶/告警配置只从服务器受限文件加载；缺失时真实任务失败关闭。
    env_file:
    - path: /opt/itemtalk/.env.backup
      required: false
    environment:
      ENVIRONMENT: backup
      MODEL_PROVIDER: mock
      STORAGE_BACKEND: cos
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: itemtalk
      DB_USER: itemtalk_admin
      DB_PASSWORD: ${DB_ADMIN_PASSWORD:?Set bootstrap password}
      COS_SECRET_ID: ${BACKUP_COS_SECRET_ID:-${COS_SECRET_ID:-}}
      COS_SECRET_KEY: ${BACKUP_COS_SECRET_KEY:-${COS_SECRET_KEY:-}}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-beijing}
    volumes:
    - /opt/itemtalk/backups:/backups
    networks:
    - itemtalk
networks:
  itemtalk:
    driver: bridge
